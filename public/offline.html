<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#41694b">
<title>Sem conexão · AssembleiaApp</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; background: #f3f4ef; color: #26332a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .cartao { max-width: 380px; text-align: center; }
  .marca { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.55; color: #6b746d; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; color: #fff; background: #41694b;
    border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #141a16; color: #e8ece8; }
    p { color: #a3ada5; }
  }
</style>
</head>
<body>
  <div class="cartao">
    <img class="marca" src="/icons/icon-192.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>O AssembleiaApp precisa de internet para mostrar os dados da igreja. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
